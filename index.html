<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <title>IHB Ice Hockey Battle | Beta</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #19252B;
            font-family: 'Arial', sans-serif;
        }
        canvas { display: block; width: 100vw; height: 100vh; }
        .scoreboard {
            position: absolute; top: 0px; left: 50.49%; transform: translateX(-50%);
            font-size: 25px; font-weight: bold; background: rgba(0, 0, 0, 0.9);
            padding: 8px 32px; border-radius: 2px; border: none;
            pointer-events: none; z-index: 10; display: flex; gap: 20px;
        }
        .team-home { color: #ff3333; text-shadow: 0 0 10px rgba(255,51,51,0.6); }
        .team-away { color: #3333ff; text-shadow: 0 0 10px rgba(51,51,255,0.6); }
        .status-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #fff; font-size: 24px; font-weight: bold; background: rgba(0,0,0,0.85);
            padding: 20px 40px; border-radius: 10px; z-index: 20; text-align: center;
        }
        #chat-container { position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); width: 700px; z-index: 100; }
        #chat-box { height: 100px; overflow-y: auto; border: 1px solid rgba(50, 50, 50, 0.7); border-radius: 10px; background: rgba(0,0,0,0.3); color: #fff; padding: 10px; margin-bottom: 1px; font-size: 14px; }
        #chat-input { width: 100%; padding: 8px; background: rgba(0,0,0,0.7); color: #fff; border: 1px solid #444; border-radius: 2px; }
    </style>
</head>
<body>
<div id="login-screen" style="position:absolute; top:40%; left:50%; transform:translate(-50%, -50%); z-index:200;">
    <input type="text" id="nick-input" placeholder="Unesi svoj nadimak..." maxlength="10">
    <button onclick="joinGame()">Uđi u igru</button>
</div>
<div id="chat-container">
    <div id="chat-box"></div>
    <input type="text" id="chat-input" placeholder="Upiši poruku..." maxlength="50">
</div>
<div class="scoreboard">
    <span class="team-home">RED</span> 
    <span id="score" style="color: #fff;">0 : 0</span> 
    <span class="team-away">BLUE</span>
</div>
<div id="statusOverlay" class="status-overlay">Povezivanje sa serverom...</div>
<canvas id="hockeyCanvas"></canvas>
    
<script>
    const socket = new WebSocket('wss://' + window.location.host);
    const canvas = document.getElementById("hockeyCanvas");
    const ctx = canvas.getContext("2d");
    
    let gameState = { players: {}, puck: { x: 0, y: 0 } };
    let myId = null;
    const WORLD_WIDTH = 3000;
    const WORLD_HEIGHT = 1500;
    let keys = {};

    function joinGame() {
        const nick = document.getElementById('nick-input').value.trim();
        if (nick === "") return alert("Unesi nadimak!");
        document.getElementById('login-screen').style.display = 'none';
        socket.send(JSON.stringify({ type: 'set-nick', nick: nick }));
    }

    function resizeCanvas() {
        canvas.width = WORLD_WIDTH;
        canvas.height = WORLD_HEIGHT;
    }

    function drawVectorField() {
        // Pozadina
        ctx.fillStyle = "#1F232B"; 
        ctx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);
        
        // Teren
        ctx.fillStyle = "#e5edf5";
        ctx.fillRect(250, 150, 2500, 1200);

        // Linije terena (pojednostavljeno za punu veličinu)
        ctx.strokeStyle = "rgba(230, 60, 60, 0.6)"; ctx.lineWidth = 10;
        ctx.beginPath(); ctx.moveTo(WORLD_WIDTH / 2, 150); ctx.lineTo(WORLD_WIDTH / 2, 1350); ctx.stroke();
        
        ctx.strokeStyle = "rgba(60, 60, 230, 0.5)"; ctx.lineWidth = 10;
        ctx.beginPath();
        ctx.moveTo(750, 150); ctx.lineTo(750, 1350);
        ctx.moveTo(2250, 150); ctx.lineTo(2250, 1350);
        ctx.stroke();
    }

    function drawPlayer(p) {
        ctx.save();
        ctx.shadowBlur = 15; ctx.shadowColor = p.color;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 35, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 5; ctx.stroke();
        ctx.restore();
        
        ctx.fillStyle = "#fff"; ctx.font = "bold 24px Arial"; ctx.textAlign = "center";
        ctx.fillText(gameState.players[p.id]?.nick || "Igrač", p.x, p.y - 50);
    }

    function gameLoop() {
        sendInput();
        ctx.clearRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);
        
        let myPlayer = gameState.players ? gameState.players[myId] : null;

        let camX = 0, camY = 0;
        if (myPlayer) {
            camX = Math.max(0, Math.min(myPlayer.x - window.innerWidth / 2, WORLD_WIDTH - window.innerWidth));
            camY = Math.max(0, Math.min(myPlayer.y - window.innerHeight / 2, WORLD_HEIGHT - window.innerHeight));
        }

        ctx.save();
        ctx.translate(-camX, -camY);

        drawVectorField();

        for (let id in gameState.players) {
            let p = gameState.players[id];
            p.id = id;
            drawPlayer(p);
        }

        if (gameState.puck) {
            ctx.fillStyle = "#1a1a1a";
            ctx.beginPath();
            ctx.arc(gameState.puck.x, gameState.puck.y, 15, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.restore();
        requestAnimationFrame(gameLoop);
    }

    function sendInput() {
        if (socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ type: 'input', keys: keys }));
        }
    }

    socket.onopen = () => document.getElementById("statusOverlay").style.display = "none";
    
    socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === 'your-id') myId = data.id;
        if (data.type === 'state') {
            gameState.players = data.players;
            gameState.puck = data.puck;
        } else if (data.type === 'chat') {
            let msg = document.createElement('div');
            msg.innerText = data.text;
            document.getElementById('chat-box').appendChild(msg);
        }
    };

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    resizeCanvas();
    gameLoop();
</script>
</body>
</html>
