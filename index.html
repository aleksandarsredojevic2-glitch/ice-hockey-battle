<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <title>IHB Ice Hockey 5v5</title>
    </head>
<body>
<script>
const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
const socket = new WebSocket(`${protocol}://${window.location.host}`);
socket.onopen = () => {
    console.log("Konekcija otvorena, pridružujem se sobi...");
    socket.send(JSON.stringify({ 
        type: 'join-room', 
        room: 'test-soba', // Možeš ovde dodati input za ime sobe
        nick: 'Igrač' 
    }));
};

const WORLD_WIDTH = 3000;
const WORLD_HEIGHT = 1500;
const ICE_WIDTH = 2600;  // Primer vrednosti
const ICE_HEIGHT = 1200; // Primer vrednosti
const canvas = document.getElementById("hockeyCanvas");
const ctx = canvas.getContext("2d");

// NOVO: Struktura igrača
let myPlayer = { id: null, x: 500, y: 500, vx: 0, vy: 0, color: '#ff3333', radius: 16, speed: 0.5 };
let players = []; // Ovde čuvamo sve ostale igrače
let puck = { x: 1500, y: 750, vx: 0, vy: 0, radius: 7, friction: 0.979 };
let gameActive = false;

// ... (tvoj ostatak koda: resizeCanvas, getSpecs, handleCollision...)
 function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            resetPositions();
        }
        window.addEventListener('resize', resizeCanvas);


    const getSpecs = () => {
            const startX = (WORLD_WIDTH - ICE_WIDTH) / 2;
            const startY = (WORLD_HEIGHT - ICE_HEIGHT) / 2;
            const r = 160; 
            
            const goalHeight = ICE_HEIGHT * 0.15;
            const goalWidth = ICE_WIDTH * 0.025;
            const goalLineOffset = ICE_WIDTH * 0.07; 

            return {
                scale: 1, 
                left: startX, 
                right: startX + ICE_WIDTH, 
                top: startY, 
                bottom: startY + ICE_HEIGHT, 
                cornerRadius: r,
                goalLineLeft: startX + goalLineOffset, 
                goalLineRight: startX + ICE_WIDTH - goalLineOffset, 
                faceoffR: ICE_HEIGHT * 0.13, 
                goal: { 
                    w: goalWidth, 
                    h: goalHeight, 
                    y: startY + (ICE_HEIGHT / 2) - (goalHeight / 2), 
                    creaseR: goalHeight * 0.55 
                }
            };
        };
        let p1 = { x: 0, y: 0, vx: 0, vy: 0, radius: 18.2, speed: 0.85, friction: 0.885, color: '#ff3333',role:'p1' };
        let p2 = { x: 0, y: 0, vx: 0, vy: 0, radius: 18.2, speed: 0.85, friction: 0.885, color: '#3333ff', role:'p2' };
        let puck = { x: 0, y: 0, vx: 0, vy: 0, radius: 7, friction: 0.979, color: '#1a1a1a' };
        let playerNicks = { p1: "Crveni", p2: "Plavi" };
        let isMaster = false; // Da li si ti taj koji računa pak?
let puckTarget = { x: 0, y: 0 }; // Gde pak treba da stigne (za interpolaciju)
        let keys = {};
        window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; keys[e.keyCode] = true; });
        window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; keys[e.keyCode] = false; });
 function handleCollision(obj1, obj2) {
            let dx = obj2.x - obj1.x; let dy = obj2.y - obj1.y;
            let distance = Math.sqrt(dx * dx + dy * dy);
            let minDist = obj1.radius + obj2.radius;

            if (distance < minDist) {
                let overlap = minDist - distance;
                let nx = distance > 0 ? dx / distance : 1; 
                let ny = distance > 0 ? dy / distance : 0;

                if (obj2 === puck) {
                    obj2.x += nx * (overlap + 1); 
                    obj2.y += ny * (overlap + 1);
                    
                    let pushForce = 0.45; 
                    obj2.vx = obj1.vx * 0.8 + nx * pushForce;
                    obj2.vy = obj1.vy * 0.8 + ny * pushForce;

                    if ((myRole === 'p1' && obj1 === p1) || (myRole === 'p2' && obj1 === p2)) {
                        socket.send(JSON.stringify({ type: 'puck-update', x: puck.x, y: puck.y, vx: puck.vx, vy: puck.vy }));
                    }
                } else {
                    obj1.x -= nx * overlap * 0.5; obj1.y -= ny * overlap * 0.5;
                    obj2.x += nx * overlap * 0.5; obj2.y += ny * overlap * 0.5;
                    let kx = obj1.vx - obj2.vx; let ky = obj1.vy - obj2.vy;
                    let p = 2 * (nx * kx + ny * ky) / 2;
                    obj1.vx -= p * nx * 1.4; obj1.vy -= p * ny * 1.4;
                    obj2.vx += p * nx * 1.4; obj2.vy += p * ny * 1.4;
                }
            }
        }
function update() {
    if (!gameActive) return;

    // 1. INPUT: Pomeri sebe
    let dx = 0; let dy = 0;
    if (keys['a'] || keys[37]) dx -= 1;
    if (keys['d'] || keys[39]) dx += 1;
    if (keys['w'] || keys[38]) dy -= 1;
    if (keys['s'] || keys[40]) dy += 1;

    let mag = Math.sqrt(dx * dx + dy * dy);
    if (mag > 0) {
        myPlayer.vx += (dx / mag) * myPlayer.speed;
        myPlayer.vy += (dy / mag) * myPlayer.speed;
    }

    // 2. FIZIKA SEBE: Trenje i pozicija
    myPlayer.vx *= 0.95; 
    myPlayer.vy *= 0.95;
    myPlayer.x += myPlayer.vx;
    myPlayer.y += myPlayer.vy;

    // 3. KOLIZIJE: Proveri sebe protiv svih ostalih igrača
    players.forEach(otherPlayer => {
        handleCollision(myPlayer, otherPlayer);
    });

    // 4. KOLIZIJE: Proveri sebe protiv paka
    handleCollision(myPlayer, puck);

    // 5. ZIDOVI: Uvek proveri granice terena za sebe
    handleRinkBoundaries(myPlayer, false);

    // 6. SLANJE: Pošalji svoju novu poziciju svima
    socket.send(JSON.stringify({ 
        type: 'player-update', 
        x: myPlayer.x, 
        y: myPlayer.y, 
        vx: myPlayer.vx, 
        vy: myPlayer.vy 
    }));
    
    // 7. PAK (Ako si Master sobe):
    if (isMaster) {
        // Master računa kretanje paka za sve
        puck.vx *= puck.friction;
        puck.vy *= puck.friction;
        puck.x += puck.vx;
        puck.y += puck.vy;
        
        // Master proverava koliziju paka sa SVIM igračima
        players.forEach(p => handleCollision(p, puck));
        handleCollision(myPlayer, puck); // Ne zaboravi sebe
        handleRinkBoundaries(puck, true);

        // Sinhronizuj pak sa svima
        socket.send(JSON.stringify({ type: 'puck-update', x: puck.x, y: puck.y }));
    }
}

function gameLoop() {
    update();

    // Kamera uvek prati myPlayer
    let camX = Math.max(0, Math.min(myPlayer.x - canvas.width / 2, WORLD_WIDTH - canvas.width));
    let camY = Math.max(0, Math.min(myPlayer.y - canvas.height / 2, WORLD_HEIGHT - canvas.height));

    ctx.save();
    ctx.translate(-camX, -camY);

    drawVectorField();
    
    // Crtamo sve ostale
    players.forEach(p => drawPlayer(p));
    // Crtamo sebe
    drawPlayer(myPlayer);
    
    ctx.restore();
    requestAnimationFrame(gameLoop);
}
function handleRinkBoundaries(obj, isPuck) {
    const s = getSpecs();
    // Jednostavno ograničavanje unutar WORLD dimenzija
    if (obj.x - obj.radius < 0) { obj.x = obj.radius; obj.vx *= -0.5; }
    if (obj.x + obj.radius > WORLD_WIDTH) { obj.x = WORLD_WIDTH - obj.radius; obj.vx *= -0.5; }
    if (obj.y - obj.radius < 0) { obj.y = obj.radius; obj.vy *= -0.5; }
    if (obj.y + obj.radius > WORLD_HEIGHT) { obj.y = WORLD_HEIGHT - obj.radius; obj.vy *= -0.5; }
}
 function drawPlayer(p) {
    ctx.save(); 
    ctx.shadowBlur = 15; 
    ctx.shadowColor = p.color; 
    ctx.fillStyle = p.color;
    
    // Crtanje igrača
    ctx.beginPath(); 
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); 
    ctx.fill();
    ctx.strokeStyle = "#ffffff"; 
    ctx.lineWidth = 3 * getSpecs().scale; 
    ctx.stroke(); 
    ctx.restore(); 
    
    // Crtanje nadimka
    ctx.fillStyle = "#1a3a5a";
    // Veličina 16 je malo suptilnija od 20
    ctx.font = `bold ${Math.floor(16 * getSpecs().scale)}px Arial`;
    ctx.textAlign = "center";
    
    // Umesto p.color, koristi ulogu
let name = (p.role === 'p1') ? playerNicks.p1 : playerNicks.p2;
    
    ctx.fillText(name, p.x, p.y - p.radius - 15);
}
let iceScratches = []; // Možeš ostaviti prazno ili generisati nasumične linije
function drawVectorField() {
            const s = getSpecs(); const g = s.goal;
            
            // 1. Pozadina celog sveta
            ctx.fillStyle = "#1F232B"; 
            ctx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);
            
            // 2. Konture terena
            ctx.beginPath();
            ctx.arc(s.left + s.cornerRadius, s.top + s.cornerRadius, s.cornerRadius, Math.PI, Math.PI * 1.5);
            ctx.lineTo(s.right - s.cornerRadius, s.top);
            ctx.arc(s.right - s.cornerRadius, s.top + s.cornerRadius, s.cornerRadius, Math.PI * 1.5, 0);
            ctx.lineTo(s.right, s.bottom - s.cornerRadius);
            ctx.arc(s.right - s.cornerRadius, s.bottom - s.cornerRadius, s.cornerRadius, 0, Math.PI * 0.5);
            ctx.lineTo(s.left + s.cornerRadius, s.bottom);
            ctx.arc(s.left + s.cornerRadius, s.bottom - s.cornerRadius, s.cornerRadius, Math.PI * 0.5, Math.PI);
            ctx.closePath();
            
            // 3. Gradijent centriran u WORLD
            let iceGrad = ctx.createRadialGradient(WORLD_WIDTH/2, WORLD_HEIGHT/2, 50, WORLD_WIDTH/2, WORLD_HEIGHT/2, WORLD_WIDTH * 0.6);
            iceGrad.addColorStop(0, "#fafcff"); iceGrad.addColorStop(1, "#e5edf5");
            ctx.fillStyle = iceGrad; ctx.fill();
            
            // 4. Ice scratches
            iceScratches.forEach(sc => {
                ctx.strokeStyle = `rgba(220, 230, 242, ${sc.alpha})`; ctx.lineWidth = 1; ctx.beginPath();
                let sx = s.left + sc.x * (s.right - s.left); let sy = s.top + sc.y * (s.bottom - s.top);
                ctx.moveTo(sx, sy); ctx.lineTo(sx + Math.cos(sc.angle)*sc.len, sy + Math.sin(sc.angle)*sc.len); ctx.stroke();
            });

            // 5. Linije terena
            ctx.strokeStyle = "rgba(230, 60, 60, 0.6)"; ctx.lineWidth = 5 * s.scale;
            ctx.beginPath(); ctx.moveTo(WORLD_WIDTH / 2, s.top); ctx.lineTo(WORLD_WIDTH / 2, s.bottom); ctx.stroke();
            
            ctx.strokeStyle = "rgba(60, 60, 230, 0.5)"; ctx.lineWidth = 6 * s.scale;
            ctx.beginPath(); 
            ctx.moveTo(s.left + (s.right - s.left) * 0.36, s.top); ctx.lineTo(s.left + (s.right - s.left) * 0.36, s.bottom);
            ctx.moveTo(s.right - (s.right - s.left) * 0.36, s.top); ctx.lineTo(s.right - (s.right - s.left) * 0.36, s.bottom);
            ctx.stroke();

            ctx.strokeStyle = "rgba(230, 60, 60, 0.6)"; ctx.lineWidth = 3 * s.scale;
            ctx.beginPath(); ctx.moveTo(s.goalLineLeft, s.top + 5); ctx.lineTo(s.goalLineLeft, s.bottom - 5);
            ctx.moveTo(s.goalLineRight, s.top + 5); ctx.lineTo(s.goalLineRight, s.bottom - 5); ctx.stroke();

            // 6. Golmanski prostor (crease)
            ctx.strokeStyle = "rgba(60, 150, 230, 0.6)"; ctx.lineWidth = 2.5 * s.scale; ctx.fillStyle = "rgba(180, 220, 255, 0.25)";
            ctx.beginPath(); ctx.arc(s.goalLineLeft, WORLD_HEIGHT / 2, g.creaseR, -Math.PI/2, Math.PI/2); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.arc(s.goalLineRight, WORLD_HEIGHT / 2, g.creaseR, Math.PI/2, -Math.PI/2); ctx.fill(); ctx.stroke();
            
            // 7. Središnji krug (dole)
            ctx.beginPath(); ctx.arc(WORLD_WIDTH / 2, s.bottom, 22 * s.scale, Math.PI, 0); ctx.stroke();
            
            // 8. Faceoff krugovi
            const circlesX = [s.left + (s.goalLineLeft - s.left) * 2.8, s.right - (s.right - s.goalLineRight) * 2.8];
            const circlesY = [s.top + s.faceoffR * 1.25, s.bottom - s.faceoffR * 1.25];
            circlesX.forEach(cx => { circlesY.forEach(cy => {
                ctx.strokeStyle = "rgba(230, 60, 60, 0.45)"; ctx.lineWidth = 2 * s.scale; ctx.fillStyle = "rgba(230, 60, 60, 0.65)";
                ctx.beginPath(); ctx.arc(cx, cy, s.faceoffR, 0, Math.PI * 2); ctx.stroke();
                ctx.beginPath(); ctx.arc(cx, cy, 4 * s.scale, 0, Math.PI * 2); ctx.fill();
            });});

            // 9. Tekst
            ctx.fillStyle = "rgba(50, 90, 140, 0.45)"; ctx.font = `bold ${Math.floor(45 * s.scale)}px Arial`; 
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText("IHB", WORLD_WIDTH / 2, WORLD_HEIGHT / 2);

            // 10. Golovi i okviri
            ctx.lineWidth = 3.5 * s.scale; ctx.fillStyle = "rgba(240, 240, 250, 0.25)"; ctx.strokeStyle = "#de2f2f";
            ctx.beginPath(); ctx.moveTo(s.goalLineLeft, g.y); ctx.lineTo(s.goalLineLeft - g.w + 10*s.scale, g.y); ctx.arcTo(s.goalLineLeft - g.w, g.y, s.goalLineLeft - g.w, g.y + g.h/2, 10*s.scale); ctx.arcTo(s.goalLineLeft - g.w, g.y + g.h, s.goalLineLeft - g.w + 10*s.scale, g.y + g.h, 10*s.scale); ctx.lineTo(s.goalLineLeft, g.y + g.h); ctx.fill(); ctx.stroke();
            ctx.lineWidth = 3.5 * s.scale; ctx.strokeStyle = "#de2f2f"; ctx.fillStyle = "rgba(240, 240, 250, 0.25)";
            ctx.beginPath(); ctx.moveTo(s.goalLineRight, g.y); ctx.lineTo(s.goalLineRight + g.w - 10*s.scale, g.y); ctx.arcTo(s.goalLineRight + g.w, g.y, s.goalLineRight + g.w, g.y + g.h/2, 10*s.scale); ctx.arcTo(s.goalLineRight + g.w, g.y + g.h, s.goalLineRight + g.w - 10*s.scale, g.y + g.h, 10*s.scale); ctx.lineTo(s.goalLineRight, g.y + g.h); ctx.fill(); ctx.stroke();
            
            // 11. Finalna linija ivice terena
            ctx.strokeStyle = "#334155"; ctx.lineWidth = 7 * s.scale;
            ctx.beginPath(); ctx.arc(s.left + s.cornerRadius, s.top + s.cornerRadius, s.cornerRadius, Math.PI, Math.PI * 1.5); ctx.lineTo(s.right - s.cornerRadius, s.top); ctx.arc(s.right - s.cornerRadius, s.top + s.cornerRadius, s.cornerRadius, Math.PI * 1.5, 0); ctx.lineTo(s.right, s.bottom - s.cornerRadius); ctx.arc(s.right - s.cornerRadius, s.bottom - s.cornerRadius, s.cornerRadius, 0, Math.PI * 0.5); ctx.lineTo(s.left + s.cornerRadius, s.bottom); ctx.arc(s.left + s.cornerRadius, s.bottom - s.cornerRadius, s.cornerRadius, Math.PI * 0.5, Math.PI); ctx.closePath(); ctx.stroke();
        }
// Uklanja igrača iz niza kada diskonektuje
socket.onmessage = (event) => {
    const data = JSON.parse(event.data);

    if (data.type === 'init') {
        myPlayer.id = data.id;
        gameActive = true; // AKTIVIRAŠ IGRU
        gameLoop();        // POKREĆEŠ PETLJU PRVI PUT
        console.log("Igra startovana!");
    } else if (data.type === 'player-update') {
        let p = players.find(pl => pl.id === data.senderId);
        if (p) {
            p.x = data.x; p.y = data.y;
            p.vx = data.vx; p.vy = data.vy;
        } else {
            players.push({ id: data.senderId, x: data.x, y: data.y, radius: 16, color: '#3333ff' });
        }
    } else if (data.type === 'player-disconnected') {
        players = players.filter(pl => pl.id !== data.senderId);
    }
};
</script>
</body>
</html>
