    <script>
        // 1. Definiši socket globalno
// Automatski detektuje da li je http ili https, i koristi port sa kog se sajt učitao
const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
const socket = new WebSocket(`${protocol}://${window.location.host}`);

// 2. Dodaj logove da vidimo šta se dešava
socket.onopen = () => {
    console.log("Konekcija otvorena!");
    document.getElementById("statusOverlay").innerText = "Povezano! Unesi nadimak.";
};

socket.onerror = (err) => {
    console.error("Socket greška:", err);
    document.getElementById("statusOverlay").innerText = "Greška konekcije!";
};
        const WORLD_WIDTH = 3000;
        const WORLD_HEIGHT = 1500;
        // Ovo je tvoja prava površina za igru
        const ICE_WIDTH = 2500;   
        const ICE_HEIGHT = 1200;
        const chatInput = document.getElementById('chat-input');
const chatBox = document.getElementById('chat-box');

chatInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && chatInput.value.trim() !== "") {
        let msg = chatInput.value;
        // Šalješ poruku na server
        socket.send(JSON.stringify({ type: 'chat-message', text: msg }));
        chatInput.value = '';
    }
});
         
        const urlParams = new URLSearchParams(window.location.search);
        const teamFromUrl = urlParams.get('team');

        const canvas = document.getElementById("hockeyCanvas");
        const ctx = canvas.getContext("2d");

        let scoreHome = 0; let scoreAway = 0;
        let myRole = null; 
        let gameActive = false;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            resetPositions();
        }
        window.addEventListener('resize', resizeCanvas);


    const getSpecs = () => {
            const startX = (WORLD_WIDTH - ICE_WIDTH) / 2;
            const startY = (WORLD_HEIGHT - ICE_HEIGHT) / 2;
            const r = 160; 
            
            const goalHeight = ICE_HEIGHT * 0.15;
            const goalWidth = ICE_WIDTH * 0.025;
            const goalLineOffset = ICE_WIDTH * 0.07; 

            return {
                scale: 1, 
                left: startX, 
                right: startX + ICE_WIDTH, 
                top: startY, 
                bottom: startY + ICE_HEIGHT, 
                cornerRadius: r,
                goalLineLeft: startX + goalLineOffset, 
                goalLineRight: startX + ICE_WIDTH - goalLineOffset, 
                faceoffR: ICE_HEIGHT * 0.13, 
                goal: { 
                    w: goalWidth, 
                    h: goalHeight, 
                    y: startY + (ICE_HEIGHT / 2) - (goalHeight / 2), 
                    creaseR: goalHeight * 0.55 
                }
            };
        };
        let p1 = { x: 0, y: 0, vx: 0, vy: 0, radius: 18.2, speed: 0.85, friction: 0.885, color: '#ff3333',role:'p1' };
        let p2 = { x: 0, y: 0, vx: 0, vy: 0, radius: 18.2, speed: 0.85, friction: 0.885, color: '#3333ff', role:'p2' };
        let puck = { x: 0, y: 0, vx: 0, vy: 0, radius: 7, friction: 0.979, color: '#1a1a1a' };
        let playerNicks = { p1: "Crveni", p2: "Plavi" };
        let isMaster = false; // Da li si ti taj koji računa pak?
let puckTarget = { x: 0, y: 0 }; // Gde pak treba da stigne (za interpolaciju)
        let keys = {};
        window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; keys[e.keyCode] = true; });
        window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; keys[e.keyCode] = false; });

        function resetPositions() {
            const s = getSpecs();
            p1.radius = 16 * s.scale; p1.speed = 0.5 * s.scale;
            p2.radius = 16 * s.scale; p2.speed = 0.5 * s.scale;
            puck.radius = 7 * s.scale;

            p1.x = canvas.width * 0.3; p1.y = canvas.height / 2; p1.vx = 0; p1.vy = 0;
            p2.x = canvas.width * 0.7; p2.y = canvas.height / 2; p2.vx = 0; p2.vy = 0;
            puck.x = canvas.width / 2; puck.y = canvas.height / 2; puck.vx = 0; puck.vy = 0;
        }

        let iceScratches = [];
        for(let i=0; i<65; i++) {
            iceScratches.push({ x: Math.random(), y: Math.random(), len: Math.random() * 25 + 10, angle: Math.random() * Math.PI * 2, alpha: Math.random() * 0.12 + 0.04 });
        }

        function playSound(freq, type, duration) {
            try {
                let context = new (window.AudioContext || window.webkitAudioContext)();
                let osc = context.createOscillator(); let gain = context.createGain();
                osc.connect(gain); gain.connect(context.destination);
                osc.type = type; osc.frequency.setValueAtTime(freq, context.currentTime);
                gain.gain.setValueAtTime(0.08, context.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, context.currentTime + duration);
                osc.start(); osc.stop(context.currentTime + duration);
            } catch(e) {}
        }

        function handleCollision(obj1, obj2) {
            let dx = obj2.x - obj1.x; let dy = obj2.y - obj1.y;
            let distance = Math.sqrt(dx * dx + dy * dy);
            let minDist = obj1.radius + obj2.radius;

            if (distance < minDist) {
                let overlap = minDist - distance;
                let nx = distance > 0 ? dx / distance : 1; 
                let ny = distance > 0 ? dy / distance : 0;

                if (obj2 === puck) {
                    obj2.x += nx * (overlap + 1); 
                    obj2.y += ny * (overlap + 1);
                    
                    let pushForce = 0.45; 
                    obj2.vx = obj1.vx * 0.8 + nx * pushForce;
                    obj2.vy = obj1.vy * 0.8 + ny * pushForce;

                    if ((myRole === 'p1' && obj1 === p1) || (myRole === 'p2' && obj1 === p2)) {
                        socket.send(JSON.stringify({ type: 'puck-update', x: puck.x, y: puck.y, vx: puck.vx, vy: puck.vy }));
                    }
                } else {
                    obj1.x -= nx * overlap * 0.5; obj1.y -= ny * overlap * 0.5;
                    obj2.x += nx * overlap * 0.5; obj2.y += ny * overlap * 0.5;
                    let kx = obj1.vx - obj2.vx; let ky = obj1.vy - obj2.vy;
                    let p = 2 * (nx * kx + ny * ky) / 2;
                    obj1.vx -= p * nx * 1.4; obj1.vy -= p * ny * 1.4;
                    obj2.vx += p * nx * 1.4; obj2.vy += p * ny * 1.4;
                }
            }
        }

        function handleRinkBoundaries(obj, isPuck = false) {
    const s = getSpecs();
    const g = s.goal;
    const bounceCoeff = isPuck ? 0.78 : 0.2;

    // Funkcija koja proverava sudar sa linijom (da li je horizontalna ili vertikalna)
    function checkLineCollision(x1, y1, x2, y2) {
        if (obj.x + obj.radius > Math.min(x1, x2) && obj.x - obj.radius < Math.max(x1, x2) &&
            obj.y + obj.radius > Math.min(y1, y2) && obj.y - obj.radius < Math.max(y1, y2)) {
            
            // Odbijanje
            if (x1 === x2) { // Vertikalna linija
                obj.vx *= -bounceCoeff;
                obj.x = (obj.x < x1) ? x1 - obj.radius : x1 + obj.radius;
            } else { // Horizontalna linija
                obj.vy *= -bounceCoeff;
                obj.y = (obj.y < y1) ? y1 - obj.radius : y1 + obj.radius;
            }
        }
    }

    // LEVI GOL: Crtamo fiziku oko celog crvenog okvira
    // Gornja horizontalna
    checkLineCollision(s.goalLineLeft - g.w, g.y, s.goalLineLeft, g.y);
    // Donja horizontalna
    checkLineCollision(s.goalLineLeft - g.w, g.y + g.h, s.goalLineLeft, g.y + g.h);
    // Zadnja vertikalna
    checkLineCollision(s.goalLineLeft - g.w, g.y, s.goalLineLeft - g.w, g.y + g.h);

    // DESNI GOL: Isto to
    checkLineCollision(s.goalLineRight + g.w, g.y, s.goalLineRight, g.y);
    checkLineCollision(s.goalLineRight + g.w, g.y + g.h, s.goalLineRight, g.y + g.h);
    checkLineCollision(s.goalLineRight + g.w, g.y, s.goalLineRight + g.w, g.y + g.h);

    // ... ostatak logike za gol (puck-in-goal) ostaje isti ...

    // 2. Logika za prolazak paka kroz gol (gol-linija)
    if (obj.x + obj.radius > s.goalLineLeft - g.w && obj.x - obj.radius < s.goalLineLeft && obj.y + obj.radius > g.y && obj.y - obj.radius < g.y + g.h) {
        if (isPuck) {
            if (obj.y > g.y + 4 && obj.y < g.y + g.h - 4) {
                if (obj.x <= s.goalLineLeft && obj.x > s.goalLineLeft - g.w) {
                    if (myRole === 'p1' || myRole === 'p2') { socket.send(JSON.stringify({ type: 'goal-scored', team: 'away' })); }
                    return;
                }
            }
        }
    }

    if (obj.x + obj.radius > s.goalLineRight && obj.x - obj.radius < s.goalLineRight + g.w && obj.y + obj.radius > g.y && obj.y - obj.radius < g.y + g.h) {
        if (isPuck) {
            if (obj.y > g.y + 4 && obj.y < g.y + g.h - 4) {
                if (obj.x >= s.goalLineRight && obj.x < s.goalLineRight + g.w) {
                    if (myRole === 'p1' || myRole === 'p2') { socket.send(JSON.stringify({ type: 'goal-scored', team: 'home' })); }
                    return;
                }
            }
        }
    }

    // 3. Logika za zidove (ivice terena i zaobljene uglove)
    let centers = [
        {x: s.left + s.cornerRadius, y: s.top + s.cornerRadius}, {x: s.right - s.cornerRadius, y: s.top + s.cornerRadius},
        {x: s.left + s.cornerRadius, y: s.bottom - s.cornerRadius}, {x: s.right - s.cornerRadius, y: s.bottom - s.cornerRadius}
    ];
    let inCorner = false;
    centers.forEach(c => {
        let inCornerX = (c.x > obj.x && c.x === s.left + s.cornerRadius) || (c.x < obj.x && c.x === s.right - s.cornerRadius);
        let inCornerY = (c.y > obj.y && c.y === s.top + s.cornerRadius) || (c.y < obj.y && c.y === s.bottom - s.cornerRadius);
        if (inCornerX && inCornerY) {
            let dx = obj.x - c.x; let dy = obj.y - c.y;
            let dist = Math.sqrt(dx * dx + dy * dy);
            let maxDist = s.cornerRadius - obj.radius;
            if (dist > maxDist) {
                inCorner = true;
                let nx = dx / dist; let ny = dy / dist;
                obj.x = c.x + nx * maxDist; obj.y = c.y + ny * maxDist;
                let dotProduct = obj.vx * nx + obj.vy * ny;
                if (dotProduct > 0) { 
                    obj.vx = (obj.vx - (1 + bounceCoeff) * dotProduct * nx);
                    obj.vy = (obj.vy - (1 + bounceCoeff) * dotProduct * ny);
                }
            }
        }
    });

    if (!inCorner) {
        if (obj.x - obj.radius < s.left) { obj.x = s.left + obj.radius; obj.vx *= -bounceCoeff; }
        if (obj.x + obj.radius > s.right) { obj.x = s.right - obj.radius; obj.vx *= -bounceCoeff; }
        if (obj.y - obj.radius < s.top) { obj.y = s.top + obj.radius; obj.vy *= -bounceCoeff; }
        if (obj.y + obj.radius > s.bottom) { obj.y = s.bottom - obj.radius; obj.vy *= -bounceCoeff; }
    }
}

        function update() {
    if (document.activeElement === document.getElementById('chat-input')) return;
    if (!gameActive || myRole === 'spectator') return;
    
    let me = (myRole === 'p1') ? p1 : p2;

    // 1. INPUT: Izračunaj kretanje
    let dx = 0; let dy = 0;
    if (keys['a'] || keys[37]) dx -= 1;
    if (keys['d'] || keys[39]) dx += 1;
    if (keys['w'] || keys[38]) dy -= 1;
    if (keys['s'] || keys[40]) dy += 1;

    let mag = Math.sqrt(dx * dx + dy * dy);
    if (mag > 0) {
        dx /= mag; dy /= mag;
        me.vx += dx * me.speed;
        me.vy += dy * me.speed;
    }

    // 2. ŠUTIRANJE (Samo Master sme da menja brzinu paka direktno)
    if (isMaster && (keys['x'] || keys[' '] || keys[32])) {
        let dxP = puck.x - me.x;
        let dyP = puck.y - me.y;
        let dist = Math.sqrt(dxP * dxP + dyP * dyP);

        if (dist < me.radius + puck.radius + 18 * getSpecs().scale) {
            let angle = Math.atan2(dyP, dxP);
            let snap = Math.PI / 4;
            angle = Math.round(angle / snap) * snap;
            puck.vx = Math.cos(angle) * 14 * getSpecs().scale;
            puck.vy = Math.sin(angle) * 14 * getSpecs().scale;
            playSound(320, 'triangle', 0.1);
        }
    }

    // 3. KOLIZIJE I FIZIKA PAKA
    if (isMaster) {
        handleCollision(p1, puck);
        handleCollision(p2, puck);
        handleCollision(p1, p2);
        handleRinkBoundaries(p1, false);
        handleRinkBoundaries(p2, false);
        handleRinkBoundaries(puck, true);
        
        // Master računa kretanje paka
        puck.vx *= puck.friction;
        puck.vy *= puck.friction;
        puck.x += puck.vx;
        puck.y += puck.vy;
        
        // Šalje ažuriranu poziciju paka svima
        socket.send(JSON.stringify({ type: 'puck-update', x: puck.x, y: puck.y }));
    } else {
        // Nisi Master: samo Lerp-uj pak ka Masterovoj poziciji
        puck.x += (puckTarget.x - puck.x) * 0.3;
        puck.y += (puckTarget.y - puck.y) * 0.3;
        
        // Igrači i dalje rešavaju sopstvene kolizije sa zidovima
        handleRinkBoundaries(me, false);
    }

    // 4. TRENJE I POZICIJA IGRAČA (Svi rade za sebe)
    [p1, p2].forEach(obj => {
        obj.vx *= obj.friction;
        obj.vy *= obj.friction;
        obj.x += obj.vx;
        obj.y += obj.vy;
    });

    // 5. SLANJE PODATAKA
    socket.send(JSON.stringify({ type: 'player-update', x: me.x, y: me.y, vx: me.vx, vy: me.vy }));
}

        socket.onmessage = (event) => {
    const data = JSON.parse(event.data);
    
    // --- INTEGRACIJA MASTER SISTEMA ---
    if (data.type === 'init') {
        isMaster = data.isMaster;
    }
    else if (data.type === 'puck-update') {
        // Ako NISI Master, ažuriraj target poziciju za Lerp
        if (!isMaster) {
            puckTarget.x = data.x;
            puckTarget.y = data.y;
        }
    }
    // ----------------------------------

    if (data.type === 'init-role') {
        myRole = data.role;
        if (typeof myPendingNick !== 'undefined') {
            playerNicks[myRole] = myPendingNick;
        }
        document.getElementById("statusOverlay").innerText = (myRole === 'spectator') 
            ? "Soba je puna." 
            : `Vi ste ${myRole === 'p1' ? 'CRVENI' : 'PLAVI'}. Čeka se protivnik...`;
    } 
    else if (data.type === 'start-game') {
        gameActive = true; 
        document.getElementById("statusOverlay").style.display = 'none';
    } 
    else if (data.type === 'update-nick') {
        playerNicks[data.role] = data.nick;
        console.log("Primljen nick za " + data.role + ": " + data.nick);
    } 
    else if (data.type === 'opponent-update') {
        let opponent = (myRole === 'p1') ? p2 : p1;
        opponent.x = data.x; opponent.y = data.y; opponent.vx = data.vx; opponent.vy = data.vy;
    } 
    else if (data.type === 'sync-puck') {
        puck.x = data.x; puck.y = data.y; puck.vx = data.vx; puck.vy = data.vy;
    } 
    else if (data.type === 'reset-round') {
        if (data.team === 'home') scoreHome++; else if (data.team === 'away') scoreAway++;
        document.getElementById("score").innerText = `${scoreHome} : ${scoreAway}`;
        playSound(90, 'sawtooth', 0.6); 
        resetPositions();
    } 
    else if (data.type === 'player-left') {
        gameActive = false; 
        document.getElementById("statusOverlay").style.display = 'block';
        document.getElementById("statusOverlay").innerText = "Protivnik je izašao.";
    } 
    else if (data.type === 'chat-message') {
        let div = document.createElement('div');
        div.innerText = data.text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
};
        function drawVectorField() {
            const s = getSpecs(); const g = s.goal;
            
            // 1. Pozadina celog sveta
            ctx.fillStyle = "#1F232B"; 
            ctx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);
            
            // 2. Konture terena
            ctx.beginPath();
            ctx.arc(s.left + s.cornerRadius, s.top + s.cornerRadius, s.cornerRadius, Math.PI, Math.PI * 1.5);
            ctx.lineTo(s.right - s.cornerRadius, s.top);
            ctx.arc(s.right - s.cornerRadius, s.top + s.cornerRadius, s.cornerRadius, Math.PI * 1.5, 0);
            ctx.lineTo(s.right, s.bottom - s.cornerRadius);
            ctx.arc(s.right - s.cornerRadius, s.bottom - s.cornerRadius, s.cornerRadius, 0, Math.PI * 0.5);
            ctx.lineTo(s.left + s.cornerRadius, s.bottom);
            ctx.arc(s.left + s.cornerRadius, s.bottom - s.cornerRadius, s.cornerRadius, Math.PI * 0.5, Math.PI);
            ctx.closePath();
            
            // 3. Gradijent centriran u WORLD
            let iceGrad = ctx.createRadialGradient(WORLD_WIDTH/2, WORLD_HEIGHT/2, 50, WORLD_WIDTH/2, WORLD_HEIGHT/2, WORLD_WIDTH * 0.6);
            iceGrad.addColorStop(0, "#fafcff"); iceGrad.addColorStop(1, "#e5edf5");
            ctx.fillStyle = iceGrad; ctx.fill();
            
            // 4. Ice scratches
            iceScratches.forEach(sc => {
                ctx.strokeStyle = `rgba(220, 230, 242, ${sc.alpha})`; ctx.lineWidth = 1; ctx.beginPath();
                let sx = s.left + sc.x * (s.right - s.left); let sy = s.top + sc.y * (s.bottom - s.top);
                ctx.moveTo(sx, sy); ctx.lineTo(sx + Math.cos(sc.angle)*sc.len, sy + Math.sin(sc.angle)*sc.len); ctx.stroke();
            });

            // 5. Linije terena
            ctx.strokeStyle = "rgba(230, 60, 60, 0.6)"; ctx.lineWidth = 5 * s.scale;
            ctx.beginPath(); ctx.moveTo(WORLD_WIDTH / 2, s.top); ctx.lineTo(WORLD_WIDTH / 2, s.bottom); ctx.stroke();
            
            ctx.strokeStyle = "rgba(60, 60, 230, 0.5)"; ctx.lineWidth = 6 * s.scale;
            ctx.beginPath(); 
            ctx.moveTo(s.left + (s.right - s.left) * 0.36, s.top); ctx.lineTo(s.left + (s.right - s.left) * 0.36, s.bottom);
            ctx.moveTo(s.right - (s.right - s.left) * 0.36, s.top); ctx.lineTo(s.right - (s.right - s.left) * 0.36, s.bottom);
            ctx.stroke();

            ctx.strokeStyle = "rgba(230, 60, 60, 0.6)"; ctx.lineWidth = 3 * s.scale;
            ctx.beginPath(); ctx.moveTo(s.goalLineLeft, s.top + 5); ctx.lineTo(s.goalLineLeft, s.bottom - 5);
            ctx.moveTo(s.goalLineRight, s.top + 5); ctx.lineTo(s.goalLineRight, s.bottom - 5); ctx.stroke();

            // 6. Golmanski prostor (crease)
            ctx.strokeStyle = "rgba(60, 150, 230, 0.6)"; ctx.lineWidth = 2.5 * s.scale; ctx.fillStyle = "rgba(180, 220, 255, 0.25)";
            ctx.beginPath(); ctx.arc(s.goalLineLeft, WORLD_HEIGHT / 2, g.creaseR, -Math.PI/2, Math.PI/2); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.arc(s.goalLineRight, WORLD_HEIGHT / 2, g.creaseR, Math.PI/2, -Math.PI/2); ctx.fill(); ctx.stroke();
            
            // 7. Središnji krug (dole)
            ctx.beginPath(); ctx.arc(WORLD_WIDTH / 2, s.bottom, 22 * s.scale, Math.PI, 0); ctx.stroke();
            
            // 8. Faceoff krugovi
            const circlesX = [s.left + (s.goalLineLeft - s.left) * 2.8, s.right - (s.right - s.goalLineRight) * 2.8];
            const circlesY = [s.top + s.faceoffR * 1.25, s.bottom - s.faceoffR * 1.25];
            circlesX.forEach(cx => { circlesY.forEach(cy => {
                ctx.strokeStyle = "rgba(230, 60, 60, 0.45)"; ctx.lineWidth = 2 * s.scale; ctx.fillStyle = "rgba(230, 60, 60, 0.65)";
                ctx.beginPath(); ctx.arc(cx, cy, s.faceoffR, 0, Math.PI * 2); ctx.stroke();
                ctx.beginPath(); ctx.arc(cx, cy, 4 * s.scale, 0, Math.PI * 2); ctx.fill();
            });});

            // 9. Tekst
            ctx.fillStyle = "rgba(50, 90, 140, 0.45)"; ctx.font = `bold ${Math.floor(45 * s.scale)}px Arial`; 
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText("IHB", WORLD_WIDTH / 2, WORLD_HEIGHT / 2);

            // 10. Golovi i okviri
            ctx.lineWidth = 3.5 * s.scale; ctx.fillStyle = "rgba(240, 240, 250, 0.25)"; ctx.strokeStyle = "#de2f2f";
            ctx.beginPath(); ctx.moveTo(s.goalLineLeft, g.y); ctx.lineTo(s.goalLineLeft - g.w + 10*s.scale, g.y); ctx.arcTo(s.goalLineLeft - g.w, g.y, s.goalLineLeft - g.w, g.y + g.h/2, 10*s.scale); ctx.arcTo(s.goalLineLeft - g.w, g.y + g.h, s.goalLineLeft - g.w + 10*s.scale, g.y + g.h, 10*s.scale); ctx.lineTo(s.goalLineLeft, g.y + g.h); ctx.fill(); ctx.stroke();
            ctx.lineWidth = 3.5 * s.scale; ctx.strokeStyle = "#de2f2f"; ctx.fillStyle = "rgba(240, 240, 250, 0.25)";
            ctx.beginPath(); ctx.moveTo(s.goalLineRight, g.y); ctx.lineTo(s.goalLineRight + g.w - 10*s.scale, g.y); ctx.arcTo(s.goalLineRight + g.w, g.y, s.goalLineRight + g.w, g.y + g.h/2, 10*s.scale); ctx.arcTo(s.goalLineRight + g.w, g.y + g.h, s.goalLineRight + g.w - 10*s.scale, g.y + g.h, 10*s.scale); ctx.lineTo(s.goalLineRight, g.y + g.h); ctx.fill(); ctx.stroke();
            
            // 11. Finalna linija ivice terena
            ctx.strokeStyle = "#334155"; ctx.lineWidth = 7 * s.scale;
            ctx.beginPath(); ctx.arc(s.left + s.cornerRadius, s.top + s.cornerRadius, s.cornerRadius, Math.PI, Math.PI * 1.5); ctx.lineTo(s.right - s.cornerRadius, s.top); ctx.arc(s.right - s.cornerRadius, s.top + s.cornerRadius, s.cornerRadius, Math.PI * 1.5, 0); ctx.lineTo(s.right, s.bottom - s.cornerRadius); ctx.arc(s.right - s.cornerRadius, s.bottom - s.cornerRadius, s.cornerRadius, 0, Math.PI * 0.5); ctx.lineTo(s.left + s.cornerRadius, s.bottom); ctx.arc(s.left + s.cornerRadius, s.bottom - s.cornerRadius, s.cornerRadius, Math.PI * 0.5, Math.PI); ctx.closePath(); ctx.stroke();
        }

        function drawPlayer(p) {
    ctx.save(); 
    ctx.shadowBlur = 15; 
    ctx.shadowColor = p.color; 
    ctx.fillStyle = p.color;
    
    // Crtanje igrača
    ctx.beginPath(); 
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); 
    ctx.fill();
    ctx.strokeStyle = "#ffffff"; 
    ctx.lineWidth = 3 * getSpecs().scale; 
    ctx.stroke(); 
    ctx.restore(); 
    
    // Crtanje nadimka
    ctx.fillStyle = "#1a3a5a";
    // Veličina 16 je malo suptilnija od 20
    ctx.font = `bold ${Math.floor(16 * getSpecs().scale)}px Arial`;
    ctx.textAlign = "center";
    
    // Umesto p.color, koristi ulogu
let name = (p.role === 'p1') ? playerNicks.p1 : playerNicks.p2;
    
    ctx.fillText(name, p.x, p.y - p.radius - 15);
}
function joinGame() {
    const nick = document.getElementById('nick-input').value.trim();
    
    if (nick === "") {
        alert("Unesi nadimak!");
        return;
    }

    // PROVERA: Ako socket nije spreman (state 0 je CONNECTING, 3 je CLOSED)
    if (socket.readyState !== WebSocket.OPEN) {
        alert("Server još uvek nije spreman. Sačekaj sekund-dva i pokušaj ponovo.");
        return;
    }

    // Sačuvaj nadimak u globalnu promenljivu
    window.myPendingNick = nick;

    // 1. Pošalji nadimak serveru
    socket.send(JSON.stringify({ type: 'set-nick', nick: nick }));
    
    // 2. Pošalji zahtev za ulazak u sobu sa malim razmakom
    setTimeout(() => {
        socket.send(JSON.stringify({ type: 'join-room', room: 'glavna' }));
        
        // 3. Sakrij login ekran tek kada pošaljemo oba zahteva
        document.getElementById('login-screen').style.display = 'none';
    }, 50);
}
        function gameLoop() {
    update();

    // PROVERA: Ako nismo još dobili ulogu, samo crtamo i čekamo
    if (!myRole) {
        requestAnimationFrame(gameLoop);
        return;
    }

    // 1. Izračunaj gde kamera treba da bude (prati igrača)
    let me = (myRole === 'p1') ? p1 : p2;
    let camX = Math.max(0, Math.min(me.x - canvas.width / 2, WORLD_WIDTH - canvas.width));
    let camY = Math.max(0, Math.min(me.y - canvas.height / 2, WORLD_HEIGHT - canvas.height));

    // 2. Počni crtanje sa "pomerenom" kamerom
    ctx.save();
    ctx.translate(-camX, -camY);

    // 3. Pozovi tvoje originalne funkcije za crtanje
    drawVectorField(); 
    drawPlayer(p1); 
    drawPlayer(p2);
    ctx.fillStyle = puck.color; ctx.beginPath(); ctx.arc(puck.x, puck.y, puck.radius, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.stroke();
    
    ctx.restore();
    requestAnimationFrame(gameLoop);
}
        resizeCanvas(); gameLoop();
    </script>
